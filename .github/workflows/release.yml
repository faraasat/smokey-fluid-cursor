name: Release

# Releases are deliberately manual. Nothing publishes on a push to main.
# Run this workflow from the Actions tab, or push a v* tag.
on:
  workflow_dispatch:
    inputs:
      release-as:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry-run:
        description: "Build and pack only, do not publish"
        required: false
        default: false
        type: boolean
      skip-bump:
        description: "Publish the version already in package.json (recovery after a failed publish)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, tag & publish
    runs-on: ubuntu-latest
    environment: npm-publish

    permissions:
      contents: write
      id-token: write # required for npm provenance

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"
          cache: npm

      # Auth is the step most likely to fail, and npm reports an expired or
      # read-only token as a 404 on PUT. Check it before anything is bumped,
      # tagged or pushed, so a bad token cannot leave the repo ahead of npm.
      - name: Verify npm credentials
        if: ${{ !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm whoami >/dev/null 2>&1; then
            echo "::error::NPM_TOKEN is missing, expired, or lacks publish rights."
            echo "::error::Create an Automation token at https://www.npmjs.com/settings/~/tokens"
            echo "::error::then update the NPM_TOKEN repository secret."
            exit 1
          fi
          echo "Authenticated to npm as $(npm whoami)"

      - name: Install dependencies
        run: npm ci

      # Everything that can fail must fail BEFORE a tag or release exists.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version & changelog
        if: ${{ !inputs.skip-bump }}
        run: npm run release -- --release-as ${{ inputs.release-as }}

      - name: Read version
        id: get_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Pack (dry run check)
        run: npm pack --dry-run

      # Publish first: if it fails, no tag or version bump has been pushed, so
      # the repository never claims a release that does not exist on npm.
      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version bump and tag
        if: ${{ !inputs.dry-run && !inputs.skip-bump }}
        run: git push origin HEAD --follow-tags

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          generate_release_notes: true
